# Foundry dbt pipeline - connection file (profiles.yml)
#
# Snowflake dbt Projects needs this file in the project root.
# KEEP IN SYNC: role, database, warehouse and schema must stay identical to
# config/foundry_config.yml and the vars: block in dbt_project.yml.
# Moving to another account = change these 3 places.
#
# account and user are DUMMY text. Snowflake ignores them and runs as the
# current account and user. No password here: nothing secret in this file.

foundry_pipeline:            # must match "profile:" in dbt_project.yml
  target: dev
  outputs:
    dev:
      type: snowflake
      account: not_needed    # dummy, ignored by Snowflake
      user: not_needed       # dummy, ignored by Snowflake
      role: DE_PIPELINE_ROLE # = role in foundry_config.yml
      database: DE_DBT       # = database in foundry_config.yml
      warehouse: DE_TEST_WH  # = warehouse in foundry_config.yml
      schema: SILVER         # = schemas.silver in foundry_config.yml
      threads: 4
