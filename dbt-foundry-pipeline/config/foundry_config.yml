# Foundry dbt pipeline - configuration file
# This is the ONLY place where environment names live.
# No account name here, because dbt runs inside the Snowflake account.
# To move to another account, change only this file.

# Where the pipeline runs (change these when moving to the company account)
database: DE_TEST
warehouse: DE_TEST_WH
# Custom least-privilege role for the pipeline (no SYSADMIN, no ACCOUNTADMIN).
# Created by an admin, not by our skills. Privileges: to be added later.
role: DE_PIPELINE_ROLE
schemas:
  bronze: BRONZE
  silver: SILVER
  gold: GOLD
  monitoring: MONITORING

# Data quality thresholds (percent of rows)
quarantine_warn_pct: 1
quarantine_stop_pct: 20

# Cost guard
credit_limit: 5.0

# Gold layer: dynamic_table (Snowflake refreshes it, uses target_lag) or table (refreshed only when dbt runs)
# IMPORTANT: gold_target_lag is used ONLY when gold_mode is dynamic_table.
# When gold_mode is table, do NOT set or use a target lag (gold_target_lag is ignored).
gold_mode: dynamic_table
gold_target_lag: 1 hour

# Load mode
load_mode: incremental_merge   # or full_reload
