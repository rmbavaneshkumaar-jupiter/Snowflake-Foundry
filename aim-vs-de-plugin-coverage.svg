<svg xmlns="http://www.w3.org/2000/svg" width="680" height="660" viewBox="0 0 680 660" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img">
<title>AIM vs Foundry and DE plugin coverage</title>
<desc>Sources flow in through AIM or Foundry skills into Snowflake bronze. The DE plugin then covers profiling, schema design, load, validation, gold build, RBAC, masking and scheduling, which AIM does not cover. Validation can reuse AIM.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="0" y="0" width="680" height="660" fill="#FFFFFF"/>
<g text-anchor="middle" dominant-baseline="central">
<rect x="60" y="40" width="270" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="195" y="58" font-size="14" font-weight="500" fill="#0C447C">AIM sources</text>
<text x="195" y="78" font-size="12" fill="#185FA5">SQL Server, Oracle, Teradata, SSIS</text>
<rect x="350" y="40" width="270" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="485" y="58" font-size="14" font-weight="500" fill="#085041">Foundry sources</text>
<text x="485" y="78" font-size="12" fill="#0F6E56">SAP, Hadoop (HDFS)</text>
<line x1="195" y1="96" x2="195" y2="128" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="485" y1="96" x2="485" y2="128" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="130" width="270" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="195" y="148" font-size="14" font-weight="500" fill="#0C447C">AIM brings data in</text>
<text x="195" y="168" font-size="12" fill="#185FA5">Convert, migrate, validate</text>
<rect x="350" y="130" width="270" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="485" y="148" font-size="14" font-weight="500" fill="#085041">Foundry skills bring data in</text>
<text x="485" y="168" font-size="12" fill="#0F6E56">SAP analyzer, Hadoop skill</text>
<line x1="195" y1="186" x2="195" y2="218" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="485" y1="186" x2="485" y2="218" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="220" width="560" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="242" font-size="14" font-weight="500" fill="#444441">Snowflake bronze (data landed)</text>
<line x1="340" y1="264" x2="340" y2="298" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="300" width="560" height="214" rx="16" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="326" font-size="14" font-weight="500" fill="#085041">DE plugin: AIM does not cover this part</text>
<text x="340" y="344" font-size="12" fill="#0F6E56">Bronze to gold, all sources</text>
<rect x="80" y="362" width="118" height="56" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="139" y="380" font-size="14" font-weight="500" fill="#2C2C2A">Profile</text>
<text x="139" y="400" font-size="12" fill="#5F5E5A">find PII, keys</text>
<rect x="214" y="362" width="118" height="56" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="273" y="380" font-size="14" font-weight="500" fill="#2C2C2A">Schema design</text>
<text x="273" y="400" font-size="12" fill="#5F5E5A">staging, gold</text>
<rect x="348" y="362" width="118" height="56" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="407" y="380" font-size="14" font-weight="500" fill="#2C2C2A">Load</text>
<text x="407" y="400" font-size="12" fill="#5F5E5A">quarantine rows</text>
<rect x="482" y="362" width="118" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8" stroke-dasharray="4 3"/>
<text x="541" y="380" font-size="14" font-weight="500" fill="#0C447C">Validation</text>
<text x="541" y="400" font-size="12" fill="#185FA5">reuse AIM</text>
<rect x="80" y="438" width="118" height="56" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="139" y="456" font-size="14" font-weight="500" fill="#2C2C2A">Gold build</text>
<text x="139" y="476" font-size="12" fill="#5F5E5A">dynamic table</text>
<rect x="214" y="438" width="118" height="56" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="273" y="456" font-size="14" font-weight="500" fill="#2C2C2A">RBAC</text>
<text x="273" y="476" font-size="12" fill="#5F5E5A">roles, grants</text>
<rect x="348" y="438" width="118" height="56" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="407" y="456" font-size="14" font-weight="500" fill="#2C2C2A">Masking</text>
<text x="407" y="476" font-size="12" fill="#5F5E5A">protect PII</text>
<rect x="482" y="438" width="118" height="56" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="541" y="456" font-size="14" font-weight="500" fill="#2C2C2A">Schedule</text>
<text x="541" y="476" font-size="12" fill="#5F5E5A">daily tasks</text>
<line x1="340" y1="514" x2="340" y2="546" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="548" width="560" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="570" font-size="14" font-weight="500" fill="#444441">Gold mart (business ready)</text>
</g>
<g dominant-baseline="central" font-size="12" fill="#5F5E5A">
<rect x="60" y="614" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text x="82" y="621">AIM</text>
<rect x="130" y="614" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/><text x="152" y="621">Foundry / DE plugin</text>
<rect x="300" y="614" width="14" height="14" rx="3" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/><text x="322" y="621">Snowflake data</text>
<rect x="440" y="614" width="14" height="14" rx="3" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.8" stroke-dasharray="3 2"/><text x="462" y="621">AIM reused inside plugin</text>
</g>
</svg>
